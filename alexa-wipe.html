  $domain = 'domain.ltd' -> hosted online ; $domain = 'local' -> local file.

    =====================================================================

                             https://domain.ltd/alexa-wipe.html>
                           - the visitor's country comes from the
                             Cloudflare CF-IPCountry header injected by
                             nginx (sub_filter @@=CFCOUNTRY=@@)

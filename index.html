<!--
  =====================================================================
  CONFIGURATION  (à modifier ici, rien d'autre à changer)
  ---------------------------------------------------------------------
  $domain = 'domain.ltd'  -> page hébergée en ligne sur https://domain.ltd
                           - le prompt de l'outil affiche
                             https://domain.ltd/alexa-wipe.html>
                           - le pays du visiteur vient de l'en-tête
                             Cloudflare CF-IPCountry injecté par nginx
                             (sub_filter @@=CFCOUNTRY=@@)

                           dans le navigateur (double-clic, file://)
                           - le prompt de l'outil affiche C:\alexa-wipe.html>
                             et la barre de titre C:\Windows\System32\cmd.exe

                             (api.country.is, puis ipwho.is, puis fuseau
                             horaire / langue du navigateur)

  dans un sous-dossier en ligne, le chemin complet est conservé.
  ---------------------------------------------------------------------
  $domain = 'domain.ltd' -> hosted online ; $domain = 'local' -> local file.
  =====================================================================
    =====================================================================
  CONFIGURATION  (edit here, nothing else to change)

                             https://domain.ltd/alexa-wipe.html>
                           - the visitor's country comes from the
                             Cloudflare CF-IPCountry header injected by
                             nginx (sub_filter @@=CFCOUNTRY=@@)

  ---------------------------------------------------------------------
  $domain = 'domain.ltd' -> hosted online ; $domain = 'local' -> local file.

      notDetected: 'Pays non détecté',
      dontClick: "Ne cliquez pas ici : glissez ce bouton dans votre barre de favoris (Ctrl+Maj+B pour l'afficher)."
    },
    en: {
      title: 'Alexa – Delete all devices',
      sub: 'No extension needed: a simple bookmark (bookmarklet) turns the Alexa page into a command prompt.',
      step1: 'Drag this button to your bookmarks bar',
      hint1: "Bookmarks bar hidden? Ctrl+Shift+B. Don't click: drag and drop.",
      step2: 'Open the Alexa page for your country',
      open: 'Open the Alexa page',
      hint2: "Sign in to your Amazon account if asked. The page shows JSON text: that's normal.",
      step3: 'Click the bookmark – two ways',
      step3text: "<p><span class='m'>Method 1 – 2 clicks (step 2 not needed):</span> from any page, click the <code>⚠ Alexa – Delete devices</code> bookmark once → it detects your country and opens the Alexa page (sign in if asked). On that page, click the bookmark a second time → the menu loads.</p>"
        + "<p><span class='m'>Method 2 – manual:</span> open the Alexa page with the button in step 2 (or type <code>" + PATH + "</code> on alexa.amazon.xx), then click the bookmark once.</p>"
        + "<p>The interface shows: country menu, language, command prompt, device list with checkboxes, <code>Delete selection</code> and <code>Delete all devices</code> buttons (double warning).</p>",
      console: 'Without a bookmark: paste into the console (F12) of the Alexa page',
      copy: 'Copy code',
      copied: 'Copied ✔',
      note: 'Firefox: <code>about:config</code> → <code>devtools.jsonview.enabled</code> = <code>false</code> (otherwise the bookmark will not run on the JSON page).',
      detecting: 'Detecting country…',
      detected: 'Detected: ',
      notDetected: 'Country not detected',
      dontClick: "Don't click here: drag this button to your bookmarks bar (Ctrl+Shift+B to show it)."
    }
  };
  /* [tld, libellé FR, libellé EN, codes pays] */
  var DOMAINS = [
    ['ca', 'Canada (.ca)', 'Canada (.ca)', ['CA']],
    ['com', 'États-Unis (.com)', 'United States (.com)', ['US']],
    ['fr', 'France (.fr)', 'France (.fr)', ['FR', 'BE', 'LU', 'MC']],
    ['co.uk', 'Royaume-Uni (.co.uk)', 'United Kingdom (.co.uk)', ['GB', 'IE']],
    ['de', 'Allemagne (.de)', 'Germany (.de)', ['DE', 'AT', 'CH', 'LI']],
    ['it', 'Italie (.it)', 'Italy (.it)', ['IT']],
    ['es', 'Espagne (.es)', 'Spain (.es)', ['ES', 'PT']],
    ['co.jp', 'Japon (.co.jp)', 'Japan (.co.jp)', ['JP']],
    ['com.au', 'Australie (.com.au)', 'Australia (.com.au)', ['AU', 'NZ']],
    ['in', 'Inde (.in)', 'India (.in)', ['IN']],
    ['com.br', 'Brésil (.com.br)', 'Brazil (.com.br)', ['BR']],
    ['com.mx', 'Mexique (.com.mx)', 'Mexico (.com.mx)', ['MX']]
  ];
  var EU = ['NL', 'SE', 'DK', 'FI', 'NO', 'PL', 'CZ', 'SK', 'HU', 'RO', 'BG', 'GR', 'HR', 'SI', 'EE', 'LV', 'LT', 'CY', 'MT', 'IS'];

  var $ = function (id) { return document.getElementById(id); };

  /* Adresse affichée comme prompt dans l'outil, selon $domain (voir le commentaire en haut du fichier) */
  var LOCAL = ($domain === 'local');
  var FILE = decodeURIComponent(location.pathname.split('/').pop() || 'alexa-wipe.html');
  var HOME_DEFAULT = 'https://domain.ltd/alexa-wipe.html';
  var home = LOCAL ? 'C:\\' + FILE : 'https://' + $domain + (/^https?:$/.test(location.protocol) ? location.pathname : '/' + FILE);
  if (home !== HOME_DEFAULT) {
    var esc = home.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    ['bm-fr', 'bm-en'].forEach(function (id) { var a = $(id); a.setAttribute('href', a.getAttribute('href').split(HOME_DEFAULT).join(esc)); });
    ['src-fr', 'src-en'].forEach(function (id) { var ta = $(id); ta.value = ta.value.split(HOME_DEFAULT).join(esc); });
  }
  var sel = $('tld'), geo = $('geo'), langSel = $('lang');
  var domainOpts = DOMAINS.map(function (d) { var o = document.createElement('option'); o.value = d[0]; sel.appendChild(o); return o; });
  var country = null;

  /* ---------- Langue : mémorisée, sinon langue du navigateur ---------- */
  var LANG = null;
  try { LANG = localStorage.getItem(LANG_KEY); } catch (e) {}
  if (!I18N[LANG]) LANG = /^fr/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'fr' : 'en';

  function renderGeo() {
    geo.textContent = country === null ? I18N[LANG].detecting : (country ? I18N[LANG].detected + country + ' → .' + sel.value : I18N[LANG].notDetected);
  }
  function applyLang() {
    var s = I18N[LANG];
    document.documentElement.lang = LANG;
    document.title = s.title;
    langSel.value = LANG;
    var i, els = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < els.length; i++) els[i].textContent = s[els[i].getAttribute('data-i18n')];
    els = document.querySelectorAll('[data-i18n-html]');
    for (i = 0; i < els.length; i++) els[i].innerHTML = s[els[i].getAttribute('data-i18n-html')];
    domainOpts.forEach(function (o, i) { o.textContent = DOMAINS[i][LANG === 'fr' ? 1 : 2]; });
    ['bm', 'src'].forEach(function (p) {
      $(p + '-fr').classList.toggle('hide', LANG !== 'fr');
      $(p + '-en').classList.toggle('hide', LANG !== 'en');
    });
    renderGeo();
  }
  langSel.onchange = function () {
    LANG = I18N[langSel.value] ? langSel.value : 'fr';
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
    applyLang();
  };
  applyLang();

  /* ---------- Pays : 1) en-tête Cloudflare via nginx, 2) sinon API externe ---------- */
  function tldFor(cc) {
    for (var i = 0; i < DOMAINS.length; i++) if (DOMAINS[i][3].indexOf(cc) >= 0) return DOMAINS[i][0];
    return EU.indexOf(cc) >= 0 ? 'fr' : 'com';
  }
  function apply(cc) {
    country = cc || '';
    if (cc) sel.value = tldFor(cc);
    renderGeo();
  }
  function getJson(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return null; }); }
  if (!LOCAL && /^[A-Z]{2}$/.test(CF_COUNTRY) && CF_COUNTRY !== 'XX' && CF_COUNTRY !== 'T1') {
    apply(CF_COUNTRY);
  } else {
    getJson('https://api.country.is/').then(function (j) {
      if (j && j.country) return j.country;
      return getJson('https://ipwho.is/').then(function (k) { return k && k.country_code ? k.country_code : null; });
    }).then(apply);
  }

  sel.onchange = renderGeo;
  $('open').onclick = function () { window.open('https://alexa.amazon.' + sel.value + PATH, '_blank'); };
  $('bm-fr').onclick = $('bm-en').onclick = function (e) { e.preventDefault(); alert(I18N[LANG].dontClick); };
  $('copy').onclick = function () {
    var ta = $('src-' + LANG);
    ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).catch(function () { document.execCommand('copy'); });
    this.textContent = I18N[LANG].copied;
  };
</script>
</body>
</html>

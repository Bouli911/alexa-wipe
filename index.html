  var EU = ['NL', 'SE', 'DK', 'FI', 'NO', 'PL', 'CZ', 'SK', 'HU', 'RO', 'BG', 'GR', 'HR', 'SI', 'EE', 'LV', 'LT', 'CY', 'MT', 'IS'];

  var $ = function (id) { return document.getElementById(id); };

  /* Adresse affichée comme prompt dans l'outil, selon $domain (voir le commentaire en haut du fichier) */
  var LOCAL = ($domain === 'local');
  var FILE = decodeURIComponent(location.pathname.split('/').pop() || 'alexa-wipe.html');
  var HOME_DEFAULT = 'https://domain.ltd/alexa-wipe.html';
  var home = LOCAL ? 'C:\\' + FILE : 'https://' + $domain + (/^https?:$/.test(location.protocol) ? location.pathname : '/' + FILE);
  if (home !== HOME_DEFAULT) {
    var esc = home.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    ['bm-fr', 'bm-en'].forEach(function (id) { var a = $(id); a.setAttribute('href', a.getAttribute('href').split(HOME_DEFAULT).join(esc)); });
    ['src-fr', 'src-en'].forEach(function (id) { var ta = $(id); ta.value = ta.value.split(HOME_DEFAULT).join(esc); });
  }
  var sel = $('tld'), geo = $('geo'), langSel = $('lang');
  var domainOpts = DOMAINS.map(function (d) { var o = document.createElement('option'); o.value = d[0]; sel.appendChild(o); return o; });
  var country = null;

  /* ---------- Langue : mémorisée, sinon langue du navigateur ---------- */
  var LANG = null;
  try { LANG = localStorage.getItem(LANG_KEY); } catch (e) {}
  if (!I18N[LANG]) LANG = /^fr/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'fr' : 'en';

  function renderGeo() {
    geo.textContent = country === null ? I18N[LANG].detecting : (country ? I18N[LANG].detected + country + ' → .' + sel.value : I18N[LANG].notDetected);
  }
  function applyLang() {
    var s = I18N[LANG];
    document.documentElement.lang = LANG;
    document.title = s.title;
    langSel.value = LANG;
    var i, els = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < els.length; i++) els[i].textContent = s[els[i].getAttribute('data-i18n')];
    els = document.querySelectorAll('[data-i18n-html]');
    for (i = 0; i < els.length; i++) els[i].innerHTML = s[els[i].getAttribute('data-i18n-html')];
    domainOpts.forEach(function (o, i) { o.textContent = DOMAINS[i][LANG === 'fr' ? 1 : 2]; });
    ['bm', 'src'].forEach(function (p) {
      $(p + '-fr').classList.toggle('hide', LANG !== 'fr');
      $(p + '-en').classList.toggle('hide', LANG !== 'en');
    });
    renderGeo();
  }
  langSel.onchange = function () {
    LANG = I18N[langSel.value] ? langSel.value : 'fr';
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
    applyLang();
  };
  applyLang();

  /* ---------- Pays : 1) en-tête Cloudflare via nginx, 2) sinon API externe ---------- */
  function tldFor(cc) {
    for (var i = 0; i < DOMAINS.length; i++) if (DOMAINS[i][3].indexOf(cc) >= 0) return DOMAINS[i][0];
    return EU.indexOf(cc) >= 0 ? 'fr' : 'com';
  }
  function apply(cc) {
    country = cc || '';
    if (cc) sel.value = tldFor(cc);
    renderGeo();
  }
  function getJson(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return null; }); }
  if (!LOCAL && /^[A-Z]{2}$/.test(CF_COUNTRY) && CF_COUNTRY !== 'XX' && CF_COUNTRY !== 'T1') {
    apply(CF_COUNTRY);
  } else {
    getJson('https://api.country.is/').then(function (j) {
      if (j && j.country) return j.country;
      return getJson('https://ipwho.is/').then(function (k) { return k && k.country_code ? k.country_code : null; });
    }).then(apply);
  }

  sel.onchange = renderGeo;
  $('open').onclick = function () { window.open('https://alexa.amazon.' + sel.value + PATH, '_blank'); };
  $('bm-fr').onclick = $('bm-en').onclick = function (e) { e.preventDefault(); alert(I18N[LANG].dontClick); };
  $('copy').onclick = function () {
    var ta = $('src-' + LANG);
    ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).catch(function () { document.execCommand('copy'); });
    this.textContent = I18N[LANG].copied;
  };
</script>
</body>
</html>
